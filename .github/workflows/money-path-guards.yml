name: money-path-guards

# Required-to-pass gate for the PERMANENTLY_PROHIBITED list and escrow
# containment. docs/FINANCE-TOOL-CONTRACTS.md Section 6.2 Layer 5.
#
# These tests import only the standard library plus pytest, so this job does
# NOT install requirements.txt. That is deliberate: the guards must hold in a
# stripped environment, and a missing third-party package must never be the
# reason a prohibition check is skipped.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check --quiet pytest

      - name: Prohibited-tool guards (incl. negative controls)
        run: python -m pytest tests/test_prohibited_tools.py -v

      - name: Escrow containment guards (incl. negative controls)
        run: python -m pytest tests/test_escrow_containment.py -v

      - name: Boot assertion must pass on a clean tree
        run: |
          python - <<'PY'
          import logging, tools
          logging.disable(logging.CRITICAL)
          from runtime.tool_policy import assert_prohibitions_intact
          tools.register_default_tools()
          assert_prohibitions_intact()
          print("prohibition guard intact")
          PY

      - name: Deliberate Cato escrow import must make boot fail
        shell: bash
        run: |
          if GENESIS_DEPLOYMENT_PROFILE=cato python -c "from escrow_guard import assert_escrow_containment; assert_escrow_containment()"; then
            echo "ERROR: Cato profile accepted the forbidden escrow_client module"
            exit 1
          fi
          echo "negative control passed: forbidden escrow artifact was rejected"

      - name: Marketplace source keeps escrow fail-closed by default
        run: |
          python - <<'PY'
          from escrow_guard import assert_escrow_containment, escrow_permitted
          assert_escrow_containment()
          assert escrow_permitted() is False
          print("marketplace source defaults to escrow containment")
          PY

id: e4l-ar
bundle: genesis-e4l-ar
write_permissions: PROPOSE_ONLY
mission: 'Open invoices, unapplied cash, credits, aging, AR vs revenue.

  '
scope:
- ACCREC AUTHORISED
- 1200 AR
- provisions
non_scope:
- collections calls
- writing off without Controller
required_inputs:
- entity_keys
- period_from
- period_to
- question
- entity pack accounting/entities/{key}.yaml
- live Xero reads (never cached balances as current)
entities_primary:
- nesllc
- xpo
tools:
  read:
  - user-e4l-xero-read.list_entities
  - get_organisation
  - get_chart_of_accounts
  - get_trial_balance
  - get_profit_and_loss
  - get_balance_sheet
  - get_bank_summary
  - list_open_receivables
  - list_open_payables
  - list_tracking_categories
  - list_transactions_for_account
  - list_recent_write_audit_log
  forbidden:
  - any Genesis finance_tool/billing_tool/commerce_tool/pricing_tool write (stubs)
  - create_tracking_* with confirm=True on live entities
  - approve/send/pay/void/bank recon finalize
  - email send
accounting_knowledge:
- nesllc AR page1 56 invoices / $28,619.77
- "Payments endpoint not in MCP \u2014 unapplied cash may be INSUFFICIENT_EVIDENCE"
procedures:
- Load entity pack + this contract
- Read live Xero for named accounts only
- Classify each claim VERIFIED/STRONGLY_INFERRED/POSSIBLE/INSUFFICIENT_EVIDENCE
- Return CROSS_AGENT_HANDOFF_CONTRACT output; no final close statement
reconciliation_tests:
- AR trial vs open invoices page completeness
- revenue cut-off vs AR
evidence_requirements: accounting/ACCOUNTING_EVIDENCE_CONTRACT.yaml
escalation_rules:
- entity mismatch
- period mismatch
- intercompany counterpart disagrees
- insufficient evidence
- proposed treatment would pay money or change bank instructions
- Material disagreement -> genesis-e4l-controller via Cato
output_contract: accounting/CROSS_AGENT_HANDOFF_CONTRACT.yaml
